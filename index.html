<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0e1419" />
    <meta name="description" content="Frostline — ski, hunt, build, and outlast the cold in a ring of mountains." />
    <title>Frostline</title>
    <link rel="icon" href="./favicon.png" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1419; }
      #app { position: fixed; inset: 0; }
      #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #ui { position: absolute; inset: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="ui"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Boot watchdog, independent of the game's own code so it still runs if something in
      // the module graph fails to load or the boot sequence hangs (slow network, an old
      // service worker/cache serving a stale bundle, a browser without WebGL2, etc.).
      // Never leaves the player staring at a blank screen with no way out.
      (function () {
        var shown = false;
        function show(msg) {
          if (shown) return;
          shown = true;
          var el = document.createElement('div');
          el.style.cssText =
            'position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;gap:14px;' +
            'align-items:center;justify-content:center;background:#0e1419;color:#f2efe8;' +
            'font:15px/1.5 system-ui,sans-serif;text-align:center;padding:24px;';
          el.innerHTML =
            '<div style="font-size:20px">Frostline is taking a while to load.</div>' +
            '<div style="opacity:.7;max-width:420px">This can happen on a slow connection, or if your ' +
            'browser cached an older version. Try reloading — a hard refresh (Shift+Reload, or Cmd/Ctrl+Shift+R) ' +
            'clears a stale cache.</div>' +
            '<button id="fl-reload" style="padding:10px 22px;border-radius:10px;border:0;background:#ff6a2b;' +
            'color:#171310;font-weight:600;font-size:15px;cursor:pointer">Reload</button>';
          document.body.appendChild(el);
          document.getElementById('fl-reload').onclick = function () {
            location.reload();
          };
        }
        window.addEventListener('error', function (e) {
          if (!window.__frostline || !window.__frostline.ready) show('error');
        });
        setTimeout(function () {
          if (!window.__frostline || !window.__frostline.ready) show('timeout');
        }, 25000);
      })();
    </script>
  </body>
</html>
